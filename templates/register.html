{% extends "base.html" %}

{% block title %}Register Account | OptiVision Eye Health{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto my-6">
  <div class="bg-white dark:bg-slate-800 rounded-3xl p-8 border border-slate-200 dark:border-slate-700 shadow-xl">
    
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-2xl bg-teal-50 dark:bg-slate-700 text-teal-600 dark:text-teal-400 flex items-center justify-center mx-auto mb-3 shadow-inner">
        <i data-lucide="user-plus" class="w-6 h-6"></i>
      </div>
      <h2 class="text-2xl font-bold text-slate-900 dark:text-slate-100">Create OptiVision Account</h2>
      <p class="text-xs text-slate-500 mt-1">Register as a patient for eye monitoring, or as an eyecare physician</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
      
      <!-- Account Type Switcher -->
      <div class="p-1 bg-slate-100 dark:bg-slate-700 rounded-2xl flex text-xs font-semibold">
        <label class="flex-1 text-center py-2 rounded-xl cursor-pointer transition has-[:checked]:bg-white dark:has-[:checked]:bg-slate-800 has-[:checked]:text-medical-600 has-[:checked]:shadow-sm">
          <input type="radio" name="role" value="patient" checked class="hidden" onchange="toggleRoleFields(this.value)">
          <i data-lucide="user" class="w-4 h-4 inline-block mr-1"></i> Patient Account
        </label>
        <label class="flex-1 text-center py-2 rounded-xl cursor-pointer transition has-[:checked]:bg-white dark:has-[:checked]:bg-slate-800 has-[:checked]:text-medical-600 has-[:checked]:shadow-sm">
          <input type="radio" name="role" value="doctor" class="hidden" onchange="toggleRoleFields(this.value)">
          <i data-lucide="stethoscope" class="w-4 h-4 inline-block mr-1"></i> Eyecare Doctor
        </label>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Full Legal Name</label>
          <input type="text" name="full_name" required placeholder="e.g. Eleanor Vance" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-xs focus:ring-2 focus:ring-medical-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Username</label>
          <input type="text" name="username" required placeholder="e.g. eleanor_v" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-xs focus:ring-2 focus:ring-medical-500">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
          <input type="email" name="email" required placeholder="eleanor@example.com" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-xs focus:ring-2 focus:ring-medical-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Password</label>
          <input type="password" name="password" required placeholder="At least 6 characters" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-xs focus:ring-2 focus:ring-medical-500">
        </div>
      </div>

      <!-- Patient Specific Fields -->
      <div id="patientFields" class="space-y-4 pt-2 border-t border-slate-100 dark:border-slate-700">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Date of Birth</label>
            <input type="date" name="date_of_birth" value="1998-05-15" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-xs">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Gender</label>
            <select name="gender" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-xs">
              <option value="Female">Female</option>
              <option value="Male">Male</option>
              <option value="Other">Other</option>
              <option value="Prefer Not To Say">Prefer Not To Say</option>
            </select>
          </div>
        </div>

        <div class="flex items-center space-x-6 text-xs text-slate-700 dark:text-slate-300">
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" name="wear_glasses" class="rounded text-medical-600 focus:ring-medical-500">
            <span>I wear glasses</span>
          </label>
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" name="wear_contacts" class="rounded text-medical-600 focus:ring-medical-500">
            <span>I wear contact lenses</span>
          </label>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Known Eye Conditions / History</label>
          <textarea name="medical_history" rows="2" placeholder="e.g. Myopia, dry eyes, glaucoma family history, laser surgery..." class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-xs"></textarea>
        </div>
      </div>

      <!-- Doctor Specific Fields -->
      <div id="doctorFields" class="space-y-4 pt-2 border-t border-slate-100 dark:border-slate-700 hidden">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Medical Title / Degrees</label>
            <input type="text" name="title" placeholder="MD, FAAO / OD" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-xs">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Clinical Specialty</label>
            <input type="text" name="specialty" placeholder="Cornea, Glaucoma, Refractive..." class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-xs">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Clinic Name</label>
            <input type="text" name="clinic_name" placeholder="Metro Vision Center" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-xs">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Telehealth Fee ($ USD)</label>
            <input type="number" name="consultation_fee" value="80" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-xs">
          </div>
        </div>
      </div>

      <button type="submit" class="w-full py-3 rounded-xl bg-medical-600 hover:bg-medical-700 text-white font-semibold text-sm shadow-md shadow-medical-600/30 transition">
        Complete Registration
      </button>
    </form>

    <div class="mt-4 text-center text-xs text-slate-500">
      Already have an account? <a href="{{ url_for('login') }}" class="text-medical-600 dark:text-medical-400 font-semibold hover:underline">Sign In</a>
    </div>

  </div>
</div>

<script>
  function toggleRoleFields(role) {
    if (role === 'doctor') {
      document.getElementById('patientFields').classList.add('hidden');
      document.getElementById('doctorFields').classList.remove('hidden');
    } else {
      document.getElementById('patientFields').classList.remove('hidden');
      document.getElementById('doctorFields').classList.add('hidden');
    }
  }
</script>
{% endblock %}
